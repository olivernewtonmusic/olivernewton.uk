<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oliver turns 14 - party invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2A2FFF; --deep:#10125C; --pop:#FFE14D; --pop2:#FF4FA3; --onpop:#10125C; --text:#FFFFFF; --paper:#F6F4FF;
  --beat:.484s;
  --panel:#FFFFFF; --panel-ink:#15163A; --panel-line:#D6D4EC; --field:#F3F2FB; --focus:#4B4BFF;
  --display:"Bricolage Grotesque","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--panel:#181933;--panel-ink:#F1F0FF;--panel-line:#34365F;--field:#22234A;--focus:#9AA0FF;}
}
:root[data-theme="dark"]{--panel:#181933;--panel-ink:#F1F0FF;--panel-line:#34365F;--field:#22234A;--focus:#9AA0FF;}

*,*::before,*::after{box-sizing:inherit}
html{
  background:var(--bg);
  background:linear-gradient(var(--bg) 50%,var(--pop) 50%);
  scroll-padding-top:env(safe-area-inset-top,0px);
  -webkit-text-size-adjust:100%;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:1.0625rem;line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--pop2);outline-offset:3px}

/* ---------- Hero ---------- */
.hero{background:var(--bg);color:var(--text);padding:clamp(1.25rem,4vw,3rem) clamp(1.25rem,5vw,4rem) 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(1.5rem,4vw,3rem);align-items:center;max-width:1200px;margin:0 auto}
.hero h1{
  margin:0;font-family:var(--display);font-stretch:75%;font-weight:800;
  font-size:clamp(3.6rem,14vw,9.5rem);line-height:.86;letter-spacing:-.025em;overflow-wrap:anywhere;
}
.hero h1 span{display:block}
.tag{margin:1.25rem 0 0;max-width:34ch;font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.4}
.when{margin:1.5rem 0 0;font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3vw,2rem);line-height:1.15}
.when span{display:block}
.when .venue{color:var(--pop)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}

.btn{
  display:inline-block;font:inherit;font-weight:700;font-size:1rem;line-height:1.2;text-decoration:none;cursor:pointer;
  padding:.85rem 1.3rem;border-radius:10px;border:3px solid var(--deep);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn.primary{background:var(--pop);color:var(--onpop);box-shadow:0 5px 0 var(--deep)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn:hover{transform:translateY(-2px)}
.btn.primary:hover{box-shadow:0 7px 0 var(--deep)}
.btn:active{transform:translateY(3px)}
.btn.primary:active{box-shadow:0 2px 0 var(--deep)}

/* deck */
.deck{position:relative;width:min(100%,480px);aspect-ratio:1;justify-self:center;container-type:inline-size}
.plinth{position:absolute;inset:0;background:var(--deep);border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.28)}
.vinyl{
  position:absolute;inset:7%;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#101016 0 2px,#1C1C26 2px 4px);
  box-shadow:0 0 0 5px #0A0A0F;
  animation:spin 1.8s linear infinite;
}
.sheen{
  position:absolute;inset:7%;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.17) 12%,transparent 18% 50%,rgba(255,255,255,.17) 62%,transparent 68%);
}
.label{
  position:absolute;inset:32%;border-radius:50%;background:var(--pop);color:var(--onpop);
  display:grid;place-content:center;text-align:center;font-family:var(--display);
}
.label::before{content:"";position:absolute;left:50%;top:7%;width:7%;aspect-ratio:1;border-radius:50%;background:var(--deep);transform:translateX(-50%)}
.label b{font-size:3rem;font-size:17cqw;font-weight:800;font-stretch:75%;line-height:.9;letter-spacing:-.02em}
.label small{font-size:.75rem;font-size:3.2cqw;font-weight:700;margin-top:.25rem;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arm{position:absolute;right:9%;top:6%;width:.9cqw;min-width:5px;height:52%;background:#D9D9EA;border-radius:4px;transform-origin:top center;transform:rotate(30deg)}
.arm::before{content:"";position:absolute;left:50%;top:-1.4cqw;width:4.6cqw;height:4.6cqw;border-radius:50%;background:#B7B7CF;transform:translateX(-50%);box-shadow:0 0 0 3px var(--deep)}
.arm::after{content:"";position:absolute;left:50%;bottom:-2.4cqw;width:3.2cqw;height:5cqw;background:#D9D9EA;border-radius:3px;transform:translateX(-50%)}
.bpm{position:absolute;left:5%;top:4%;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--pop);line-height:1}
.bpm b{font-size:1.5rem;font-weight:800;margin-right:.2rem}
.sticker{
  position:absolute;left:-3%;bottom:4%;width:7.5rem;aspect-ratio:1;border-radius:50%;
  background:var(--pop2);color:var(--deep);display:grid;place-content:center;text-align:center;
  transform:rotate(-10deg);font-family:var(--display);line-height:1;box-shadow:0 5px 0 var(--deep);
}
.sticker b{font-size:2.3rem;font-weight:800}
.sticker span{font-size:.85rem;font-weight:700;margin-top:.15rem}

/* equaliser rising from the band below */
.eq{display:flex;gap:4px;align-items:flex-end;height:96px;max-width:1200px;margin:2rem auto 0}
.eq i{flex:1;height:100%;background:var(--pop);border-radius:3px 3px 0 0;transform-origin:bottom;transform:scaleY(.12)}
.live .eq i{animation:eq calc(var(--beat) * var(--m,1)) ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes eq{from{transform:scaleY(.1)}to{transform:scaleY(var(--h,.8))}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Details band ---------- */
.paper{background:var(--paper);color:var(--deep);padding:clamp(2.5rem,6vw,5rem) clamp(1.25rem,5vw,4rem)}
.paper-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(2rem,6vw,5rem);max-width:1200px;margin:0 auto}
.paper h2,.rsvp h2{margin:0 0 1rem;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:.95;letter-spacing:-.015em}
dl.details{margin:0}
.row{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;padding:1.15rem 0;border-top:3px solid var(--deep)}
.row:last-child{border-bottom:3px solid var(--deep)}
.row dt{font-weight:700;padding-top:.35rem}
.row dd{margin:0}
.row .big{display:block;font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.1}
.row .sub{display:block;margin-top:.3rem;white-space:pre-line}
.row a{font-weight:600}
ol.set{list-style:none;margin:0;padding:0}
ol.set li{display:grid;grid-template-columns:5.5rem 1fr;gap:.75rem;align-items:baseline;padding:.85rem 0;border-top:2px dashed rgba(16,18,92,.3);border-top:2px dashed color-mix(in srgb,var(--deep) 30%,transparent)}
ol.set li:first-child{border-top:3px solid var(--deep)}
ol.set .t{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
ol.set .l{font-size:1.15rem;font-weight:500}

/* ---------- RSVP band ---------- */
.rsvp{background:var(--pop);color:var(--onpop);padding:clamp(2.5rem,6vw,4.5rem) clamp(1.25rem,5vw,4rem)}
.rsvp-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center;max-width:1200px;margin:0 auto}
.rsvp p{margin:0;max-width:40ch;font-size:1.15rem}
.rsvp .actions{margin-top:0;justify-content:flex-start}
.rsvp .btn.primary{background:var(--deep);color:var(--pop);border-color:var(--deep);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.rsvp .btn.ghost{border-color:var(--deep)}
.rsvp :focus-visible{outline-color:var(--deep)}

@media (max-width:820px){
  .hero-grid,.paper-grid,.rsvp-grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:.25rem}
  .row dt{padding-top:0}
  .sticker{left:0;width:6.25rem}
  .sticker b{font-size:1.9rem}
  .eq{height:72px;gap:3px}
}

/* ---------- RSVP form ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rsvp-form{display:grid;gap:.9rem}
.rsvp-form .seg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;border:0;margin:0;padding:0;min-width:0}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;text-align:center;font-weight:700;padding:.8rem .5rem;border:3px solid var(--deep);border-radius:10px}
.seg input:checked+span{background:var(--deep);color:var(--pop)}
.seg input:focus-visible+span{outline:3px solid var(--deep);outline-offset:3px}
.rf{display:block}
.rf[hidden]{display:none}
.rf>span{display:block;font-weight:700;font-size:.95rem;margin-bottom:.3rem}
.rf input,.rf textarea{width:100%;font:inherit;font-size:16px;color:var(--deep);background:#fff;border:3px solid var(--deep);border-radius:10px;padding:.65rem .8rem}
.rf textarea{resize:vertical}
.rsvp-msg{margin:0;min-height:1.4rem;font-weight:700}
.rsvp-msg.err{color:#8A0F1F}
.rsvp-form .btn{justify-self:start}
.rsvp-done h3{margin:0 0 .5rem;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:2rem;line-height:1;overflow-wrap:anywhere}
.rsvp-done p{margin:0 0 1rem}
.rsvp .alt{margin-top:1rem;font-size:1rem}
.rsvp .alt a{font-weight:700}

/* ---------- Host tools ---------- */
#hostBtn{
  position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:20;
  font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  background:var(--deep);color:#fff;border:3px solid #fff;border-radius:999px;padding:.6rem 1.1rem;box-shadow:0 6px 18px rgba(0,0,0,.35);
}
#hostBtn[hidden]{display:none}
#panel{
  position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(460px,100vw);
  display:flex;flex-direction:column;background:var(--panel);color:var(--panel-ink);font-size:1rem;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:-14px 0 40px rgba(0,0,0,.35);
  transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;
}
#panel.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
#panel :focus-visible{outline-color:var(--focus)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:2px solid var(--panel-line)}
.ph h2{margin:0;font-family:var(--display);font-size:1.4rem;font-weight:800}
.pb{flex:1;overflow-y:auto;padding:1rem 1.25rem 1.5rem}
.pb .hint{margin:0 0 .5rem;font-size:.95rem;opacity:.85}
.pf{padding:.85rem 1.25rem;border-top:2px solid var(--panel-line);background:var(--panel)}
.pf .row2{display:flex;gap:.6rem}
.pf .btn{flex:1;text-align:center;padding:.75rem 1rem;font-size:.95rem}
.pf .btn.primary{background:var(--focus);color:#fff;border-color:var(--focus);box-shadow:none}
.pf .btn.ghost{color:var(--panel-ink);border-color:var(--panel-line)}
.pf .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#status{min-height:1.4rem;margin:0 0 .5rem;font-size:.92rem;font-weight:600}
#status.err{color:#D4183D}
.mini{font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;background:var(--field);color:inherit;border:2px solid var(--panel-line);border-radius:8px;padding:.4rem .75rem}
fieldset{border:0;border-top:2px solid var(--panel-line);margin:1.1rem 0 0;padding:.9rem 0 0;min-width:0}
legend{font-weight:800;font-size:1.05rem;padding:0 .6rem 0 0;font-family:var(--display)}
.f{display:block;margin:0 0 .85rem}
.f>span{display:block;font-size:.88rem;font-weight:600;margin-bottom:.3rem}
.f input:not([type=checkbox]):not([type=range]),.f textarea{
  width:100%;font:inherit;font-size:16px;color:inherit;background:var(--field);
  border:2px solid var(--panel-line);border-radius:8px;padding:.6rem .7rem;
}
.f textarea{resize:vertical}
.f input[type=range]{width:100%}
.f.check{display:flex;gap:.6rem;align-items:center}
.f.check span{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.srow{display:grid;grid-template-columns:6.4rem 1fr auto;gap:.5rem;margin-bottom:.5rem;align-items:center}
.srow input{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--field);border:2px solid var(--panel-line);border-radius:8px;padding:.5rem .6rem}
.swatches{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem}
.sw{width:3.4rem;height:3.4rem;border-radius:12px;border:3px solid var(--panel-line);cursor:pointer;padding:0;overflow:hidden;position:relative}
.sw i{position:absolute;inset:0}
.sw[aria-pressed="true"]{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus)}

@media (prefers-reduced-motion:reduce){
  .vinyl{animation:none}
  .live .eq i{animation:none;transform:scaleY(var(--h,.7))}
  #panel,#panel.open{transition:none}
  .btn{transition:none}
}
</style>
</head>

<aside id="panel" aria-label="Host tools" aria-hidden="true"></aside>

var PALETTES = {
  cobalt:{name:'Cobalt', bg:'#2A2FFF', deep:'#10125C', pop:'#FFE14D', pop2:'#FF4FA3', onpop:'#10125C', text:'#FFFFFF', paper:'#F6F4FF'},
  violet:{name:'Ultraviolet', bg:'#5B21D6', deep:'#1E0B4D', pop:'#C6FF3D', pop2:'#FF7AD9', onpop:'#1E0B4D', text:'#FFFFFF', paper:'#F7F3FF'},

  mint:{name:'Mint club', bg:'#0A6B50', deep:'#03271D', pop:'#FFD166', pop2:'#FF6B8A', onpop:'#03271D', text:'#FFFFFF', paper:'#F0FAF5'}
};

var DEFAULTS = {
  name:'Alex', age:14,

try { saved = JSON.parse($('#state').textContent || '{}'); } catch(e){ saved = {}; }
saved = Object.assign({}, DEFAULTS, saved);
var draft = clone(saved);

function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- formatting ---------- */
function fmtDate(d){
  if(!d) return '';
  var dt = new Date(d + 'T12:00:00');
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
}
function fmtTime(t){
  if(!t) return '';
  var p = String(t).split(':').map(Number);
  if(isNaN(p[0])) return '';
  var h = p[0], m = p[1] || 0, ap = h >= 12 ? 'pm' : 'am', hh = ((h + 11) % 12) + 1;
  return m ? hh + ':' + String(m).padStart(2, '0') + ap : hh + ap;
}
function countdown(s){
  if(!s.date) return null;
  var d = new Date(s.date + 'T00:00:00'); if(isNaN(d)) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  var n = Math.round((d - t) / 864e5);
  if(n < 0) return null;
  if(n === 0) return {big:'Today', small:'is the day'};
  return {big:String(n), small:n === 1 ? 'day to go' : 'days to go'};
}
function mapHref(s){
  if(/^https?:\/\//i.test(s.mapUrl || '')) return s.mapUrl;
  var q = ((s.venue || '') + ' ' + (s.address || '')).replace(/\s+/g, ' ').trim();
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
}

var app = $('#app');
var playing = false;

function bars(){
  var out = '', mults = [1,2,.5,1,2,1,.5,2];
  for(var i = 0; i < 40; i++){

  var host = (s.contactName || 'the host');
  var sms = phone ? 'sms:' + phone + '?&body=' + encodeURIComponent('Hi ' + host + ", we'll be at " + (s.name || '') + "'s birthday" + (date ? ' on ' + date : '') + '.') : '';
  var maps = mapHref(s);
  var rsvpBy = fmtDate(s.rsvpBy);

  var setHTML = (s.setlist || []).map(function(it){
    return '<li><span class="t">' + esc(fmtTime(it.t)) + '</span><span class="l">' + esc(it.label) + '</span></li>';
  }).join('');

  var rows = '';
  rows += '<div class="row"><dt>When</dt><dd><span class="big">' + esc(date) + '</span>' + (times ? '<span class="sub">' + esc(times) + '</span>' : '') + '</dd></div>';
  rows += '<div class="row"><dt>Where</dt><dd><span class="big">' + esc(s.venue) + '</span>' +

        '<label><input type="radio" name="attending" value="no"><span>Can\'t make it</span></label>' +
      '</fieldset>' +
      '<label class="rf"><span>Your name</span><input name="name" type="text" maxlength="80" autocomplete="name" required></label>' +
      '<label class="rf" id="rfGuests"><span>How many of you are coming?</span><input name="guests" type="number" min="1" max="10" value="1" inputmode="numeric"></label>' +
      '<label class="rf"><span>Allergies or anything else we should know (optional)</span><textarea name="notes" rows="2" maxlength="300"></textarea></label>' +
      '<p class="rsvp-msg" id="rsvpMsg" role="status" aria-live="polite"></p>' +
      '<button class="btn primary" type="submit">Send RSVP</button>' +
    '</form>';
  rsvpFormHTML = formHTML;
  var noteLine = rsvpBy ? 'Let us know by ' + esc(rsvpBy) + '.' : 'Let us know if you can make it.';
  var altLine = phone ? '<p class="alt">Prefer to text? <a href="' + esc(sms) + '">Text ' + esc(host) + '</a> or <a href="tel:' + esc(phone) + '">call ' + esc(s.contactPhone) + '</a>.</p>' : '';
  var rsvpSection =
    '<section class="rsvp" id="rsvp" aria-label="RSVP"><div class="rsvp-grid">' +
      '<div><h2>Are you coming?</h2><p>' + noteLine + '</p>' + (formOn ? altLine : '') + '</div>' +
      (formOn
        ? '<div id="rsvpBox">' + formHTML + '</div>'
        : (phone ? '<div class="actions"><a class="btn primary" href="' + esc(sms) + '">Text ' + esc(host) + '</a><a class="btn ghost" href="tel:' + esc(phone) + '">Call ' + esc(s.contactPhone) + '</a></div>' : '')) +
    '</div></section>';

  app.innerHTML =
    '<section class="hero' + (playing ? ' live' : '') + '" id="stage" aria-label="Invitation">' +
      '<div class="hero-grid">' +
        '<div>' +
          '<h1><span>' + esc(s.name) + '</span><span>turns ' + esc(s.age) + '</span></h1>' +
          (s.tagline ? '<p class="tag">' + esc(s.tagline) + '</p>' : '') +
          '<p class="when">' + (date ? '<span>' + esc(date) + '</span>' : '') + (times ? '<span>' + esc(times) + '</span>' : '') + (s.venue ? '<span class="venue">' + esc(s.venue) + '</span>' : '') + '</p>' +
          '<div class="actions">' +
            (s.sound ? '<button class="btn primary" id="beatBtn" type="button" aria-pressed="' + playing + '">' + (playing ? 'Stop the beat' : 'Drop the beat') + '</button>' : '') +
            '<a class="btn ghost" href="#rsvp">RSVP</a>' +
          '</div>' +
        '</div>' +
        '<div class="deck" aria-hidden="true">' +
          '<div class="plinth"></div>' +
          '<div class="bpm"><b>' + bpm + '</b>BPM</div>' +
          '<div class="vinyl"><div class="label"><b>' + esc(s.age) + '</b><small>' + esc(s.name) + '\'s set</small></div></div>' +
          '<div class="sheen"></div>' +
          '<div class="arm"></div>' +
          (cd ? '<div class="sticker"><b>' + esc(cd.big) + '</b><span>' + esc(cd.small) + '</span></div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="eq" aria-hidden="true">' + bars() + '</div>' +
    '</section>' +
    '<section class="paper" aria-label="Details">' +
      '<div class="paper-grid">' +
        '<div><h2>The details</h2><dl class="details">' + rows + '</dl></div>' +
        (setHTML ? '<div><h2>The setlist</h2><ol class="set">' + setHTML + '</ol></div>' : '') +
      '</div>' +
    '</section>' +
    rsvpSection;

  var b = $('#beatBtn'); if(b) b.addEventListener('click', toggleBeat);
  bindRsvp(s, host, phone);
}

/* ---------- RSVP form ---------- */
var rsvpFormHTML = '';
function bindRsvp(s, host, phone){
  var f = $('#rsvpForm'); if(!f) return;
  var box = $('#rsvpBox'), msg = $('#rsvpMsg'), g = $('#rfGuests');
  f.addEventListener('change', function(e){ if(e.target.name === 'attending') g.hidden = (e.target.value === 'no'); });
  f.addEventListener('submit', async function(e){
    e.preventDefault();
    var d = new FormData(f), name = String(d.get('name') || '').trim();
    var yes = d.get('attending') === 'yes';
    if(!name){ msg.className = 'rsvp-msg err'; msg.textContent = 'Please add your name.'; f.querySelector('[name=name]').focus(); return; }
    var payload = {
      name: name, attending: yes,
      guests: yes ? Math.max(1, Math.min(10, parseInt(d.get('guests'), 10) || 1)) : 0,
      notes: String(d.get('notes') || '').trim().slice(0, 300)
    };
    var btn = f.querySelector('button[type=submit]'); btn.disabled = true; msg.className = 'rsvp-msg'; msg.textContent = 'Sending...';
    try{
      var res = await fetch(s.rsvpUrl || 'rsvp.php', {method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'}, body:JSON.stringify(payload)});
      if(!res.ok) throw new Error('failed');
      box.innerHTML = '<div class="rsvp-done"><h3></h3><p></p><button class="btn ghost" type="button" id="rsvpAgain">Change my answer</button></div>';
      box.querySelector('h3').textContent = 'Thanks, ' + name + '.';
      box.querySelector('p').textContent = yes
        ? "You're on the list" + (fmtDate(s.date) ? '. See you on ' + fmtDate(s.date) + '.' : '.')
        : "Sorry you can't make it. Thanks for letting us know.";
      $('#rsvpAgain').addEventListener('click', function(){ box.innerHTML = rsvpFormHTML; bindRsvp(s, host, phone); });
    }catch(err){
      msg.className = 'rsvp-msg err';
      msg.textContent = "That didn't send." + (phone ? ' Please text ' + host + ' instead.' : ' Please try again in a moment.');
      btn.disabled = false;
    }
  });
}

/* ---------- the beat (Web Audio, starts only on tap) ---------- */
var ac, master, noiseBuf, timer = null, nextT = 0, stp = 0;

function initAudio(){
  if(ac) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = .6; master.connect(ac.destination);
  var len = Math.floor(ac.sampleRate * .5);
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function kick(t){
  var o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .4);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .42);
}
function noise(t, dur, type, freq, vol){
  var s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
function bass(t, freq, dur){
  var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = 380;
  g.gain.setValueAtTime(.28, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function hit(step, t, spb){
  if(step % 4 === 0) kick(t);
  if(step % 4 === 2){ noise(t, .09, 'highpass', 7000, .35); bass(t, [55, 55, 65.41, 49][step >> 2], spb * .4); }
  if(step % 2 === 1) noise(t, .03, 'highpass', 9000, .12);
  if(step === 4 || step === 12) noise(t, .18, 'bandpass', 1800, .5);
}
function tick(){
  var spb = 60 / Math.max(60, Math.min(200, Number(draft.bpm) || 120)), sd = spb / 4;
  while(nextT < ac.currentTime + .15){ hit(stp, nextT, spb); nextT += sd; stp = (stp + 1) % 16; }
}
function applyPlaying(){
  var stage = $('#stage'), b = $('#beatBtn');
  if(stage) stage.classList.toggle('live', playing);
  if(b){ b.textContent = playing ? 'Stop the beat' : 'Drop the beat'; b.setAttribute('aria-pressed', String(playing)); }
}
function startBeat(){
  initAudio(); if(!ac) return;
  if(ac.resume) ac.resume();
  stp = 0; nextT = ac.currentTime + .06; timer = setInterval(tick, 25); playing = true; applyPlaying();
}
function stopBeat(){ clearInterval(timer); timer = null; playing = false; applyPlaying(); }
function toggleBeat(){ playing ? stopBeat() : startBeat(); }
window.addEventListener('pagehide', function(){ if(playing) stopBeat(); });

/* ---------- host tools ---------- */
var ART = null, panel = $('#panel'), hostBtn = $('#hostBtn'), panelBuilt = false;

function fld(k, label, type, extra){ return '<label class="f"><span>' + label + '</span><input data-k="' + k + '" type="' + (type || 'text') + '" ' + (extra || '') + '></label>'; }
function area(k, label){ return '<label class="f"><span>' + label + '</span><textarea data-k="' + k + '" rows="2"></textarea></label>'; }

function buildPanel(){
  panel.innerHTML =
    '<div class="ph"><h2>Host tools</h2><button type="button" class="mini" id="pClose">Close</button></div>' +
    '<div class="pb">' +
      '<p class="hint">Changes show in the invite as you type. Publish to update it for every guest.</p>' +
      '<fieldset><legend>The party</legend>' +
        fld('name', "Birthday boy's name") +
        fld('age', 'Turning', 'number', 'min="1" max="99" inputmode="numeric"') +
        area('tagline', 'Tagline') +
      '</fieldset>' +
      '<fieldset><legend>Time and place</legend>' +
        fld('date', 'Date', 'date') +
        '<div class="two">' + fld('start', 'Starts', 'time') + fld('end', 'Ends', 'time') + '</div>' +
        fld('venue', 'Venue name') +
        area('address', 'Address') +
        fld('mapUrl', 'Map link (optional)', 'url', 'placeholder="https://"') +
      '</fieldset>' +
      '<fieldset><legend>Guest info</legend>' +
        fld('dress', 'What to wear') +
        area('note', 'Extra note for guests') +
        fld('rsvpBy', 'RSVP by', 'date') +
        '<div class="two">' + fld('contactName', 'Contact name') + fld('contactPhone', 'Contact mobile', 'tel') + '</div>' +
        '<label class="f check"><input data-k="rsvpForm" type="checkbox"><span>Show the RSVP form on the page</span></label>' +
        fld('rsvpUrl', 'RSVP form sends to', 'text', 'placeholder="rsvp.php"') +
        '<p class="hint" id="viewRow"><a id="viewRsvp" href="rsvp.php" target="_blank" rel="noopener">View replies</a></p>' +
      '</fieldset>' +
      '<fieldset><legend>Setlist</legend><div id="setEd"></div><button type="button" class="mini" id="addSong">Add a song</button></fieldset>' +
      '<fieldset><legend>Look and sound</legend>' +
        '<div class="swatches" id="sws"></div>' +
        '<label class="f"><span>Beat speed: <output id="bpmOut"></output> BPM</span><input data-k="bpm" type="range" min="80" max="160" step="1"></label>' +
        '<label class="f check"><input data-k="sound" type="checkbox"><span>Show the "Drop the beat" button</span></label>' +
      '</fieldset>' +
    '</div>' +
    '<div class="pf"><p id="status" role="status" aria-live="polite"></p>' +
      '<div class="row2"><button type="button" class="btn ghost" id="pDiscard">Discard changes</button><button type="button" class="btn primary" id="pSave">Publish changes</button></div>' +
    '</div>';

  var sw = $('#sws');
  Object.keys(PALETTES).forEach(function(k){
    var p = PALETTES[k], b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.dataset.p = k; b.setAttribute('aria-label', p.name);
    b.innerHTML = '<i style="background:linear-gradient(135deg,' + p.bg + ' 55%,' + p.pop + ' 55%)"></i>';
    b.addEventListener('click', function(){ draft.palette = k; syncSwatches(); render(draft); });
    sw.appendChild(b);
  });

  panel.addEventListener('input', function(e){
    var el = e.target, k = el.dataset && el.dataset.k;
    if(!k) return;
    if(el.type === 'checkbox') draft[k] = el.checked;
    else if(el.type === 'number' || el.type === 'range') draft[k] = Number(el.value);
    else draft[k] = el.value;
    if(k === 'bpm') $('#bpmOut').textContent = el.value;
    syncView();
    render(draft);
  });
  $('#pClose').addEventListener('click', closePanel);
  $('#addSong').addEventListener('click', function(){ draft.setlist.push({t:'', label:''}); setEditor(); render(draft); var ins = panel.querySelectorAll('.srow'); var last = ins[ins.length - 1]; if(last) last.querySelector('input[type=text]').focus(); });
  $('#pDiscard').addEventListener('click', function(){ draft = clone(saved); fillPanel(); render(draft); status('Changes discarded.'); });
  $('#pSave').addEventListener('click', publish);
  if(!ART){ $('#pSave').textContent = 'Download updated file'; $('.hint').textContent = 'Changes show as you type. Download the file, then upload it to your server to update the invite for every guest.'; status(''); }
  panelBuilt = true;
}

function fillPanel(){
  panel.querySelectorAll('[data-k]').forEach(function(el){
    var k = el.dataset.k;
    if(el.type === 'checkbox') el.checked = !!draft[k]; else el.value = draft[k] == null ? '' : draft[k];
  });
  $('#bpmOut').textContent = draft.bpm;
  syncSwatches(); setEditor(); syncView();
}
function syncView(){
  var row = $('#viewRow'), a = $('#viewRsvp'); if(!row || !a) return;
  var u = String(draft.rsvpUrl || 'rsvp.php').trim();
  row.hidden = /^https?:/i.test(u) || draft.rsvpForm === false;
  a.href = u.split('?')[0];
}
function syncSwatches(){ panel.querySelectorAll('.sw').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.p === draft.palette)); }); }

function setEditor(){
  var box = $('#setEd'); box.innerHTML = '';
  draft.setlist.forEach(function(it, i){
    var row = document.createElement('div'); row.className = 'srow';
    row.innerHTML = '<input type="time" aria-label="Time for song ' + (i + 1) + '"><input type="text" aria-label="What happens" placeholder="What happens"><button type="button" class="mini" aria-label="Remove this song">Remove</button>';
    var ins = row.querySelectorAll('input');
    ins[0].value = it.t || ''; ins[1].value = it.label || '';
    ins[0].addEventListener('input', function(){ it.t = ins[0].value; render(draft); });
    ins[1].addEventListener('input', function(){ it.label = ins[1].value; render(draft); });
    row.querySelector('button').addEventListener('click', function(){ draft.setlist.splice(i, 1); setEditor(); render(draft); });
    box.appendChild(row);
  });
}

function status(msg, err){ var s = $('#status'); if(!s) return; s.textContent = msg || ''; s.className = err ? 'err' : ''; }

function cleaned(){
  var s = clone(draft);
  ['name','tagline','venue','address','mapUrl','dress','note','contactName','contactPhone'].forEach(function(k){ s[k] = String(s[k] || '').trim(); });
  s.age = Math.max(1, Math.min(99, Math.round(Number(s.age) || 14)));
  s.bpm = Math.max(80, Math.min(160, Math.round(Number(s.bpm) || 124)));
  if(!PALETTES[s.palette]) s.palette = 'cobalt';
  s.sound = !!s.sound;
  s.rsvpForm = s.rsvpForm !== false;
  s.rsvpUrl = String(s.rsvpUrl || '').trim();
  if(!/^(https:\/\/\S+|[\w.\/-]+)$/.test(s.rsvpUrl)) s.rsvpUrl = 'rsvp.php';
  s.setlist = (s.setlist || []).filter(function(it){ return String(it.label || '').trim(); })
    .map(function(it){ return {t: it.t || '', label: String(it.label).trim()}; })
    .sort(function(a, b){ return (a.t || '99:99') < (b.t || '99:99') ? -1 : 1; });
  return s;
}

function buildDoc(s){
  var json = JSON.stringify(s).replace(/</g, '\\u003c');
  var title = (s.name || 'Party') + ' turns ' + s.age + ' - party invite';
  return SHELL
    .replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, function(m, a, b){ return a + json + b; })
    .replace(/<title>[\s\S]*?<\/title>/, function(){ return '<title>' + esc(title) + '</title>'; });
}

async function publish(){
  if(!ART){
    var out = cleaned();
    var blob = new Blob([buildDoc(out)], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    saved = out; draft = clone(out);
    status('Downloaded as index.html. Upload it to your server to replace the old one.');
    return;
  }
  var btn = $('#pSave'); btn.disabled = true; status('Publishing...');
  var s = cleaned();
  try{
    await ART.publish(buildDoc(s));
    saved = s; draft = clone(s);
    status('Published. Guests will see the new version.');
  }catch(e){
    var code = e && e.code;
    status(code === 'conflict' ? 'Someone published a newer version first. The page is reloading to it.' :
           (code === 'not_granted' || code === 'not_writer') ? 'Only the owner of this page can publish changes.' :
           'Could not publish. Try again in a moment.', true);
  }
  btn.disabled = false;
}

function openPanel(){
  if(!panelBuilt) buildPanel();
  fillPanel();
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); hostBtn.setAttribute('aria-expanded', 'true');
  var first = panel.querySelector('input'); if(first) first.focus();
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); hostBtn.setAttribute('aria-expanded', 'false');
  hostBtn.focus();
}
hostBtn.addEventListener('click', function(){ panel.classList.contains('open') ? closePanel() : openPanel(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });

function showHost(art){ ART = art; hostBtn.hidden = false; }

/* Light up the host tools only for people who can edit this page. */
(async function(){
  var wantHash = location.hash === '#host';
  if(!(window.claude && window.claude.use)){ if(wantHash) showHost(null); return; }
  try{
    var res = await Promise.all([window.claude.use('user'), window.claude.use('artifact')]);
    var user = res[0], art = res[1];
    var can = !!(user && user.canEdit && user.canEdit());
    if(art && (can || wantHash)) showHost(art);
    else if(wantHash) showHost(null);
  }catch(e){ if(wantHash) showHost(null); }
})();

render(draft);
})();
</script></body></html>
